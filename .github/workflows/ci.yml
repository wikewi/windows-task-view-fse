name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore WindowsTaskViewFSE.sln

    - name: Build
      run: dotnet build WindowsTaskViewFSE.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test WindowsTaskViewFSE.sln --no-build --configuration Release --verbosity normal
